<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bottle Keeper">
<title>Bottle Keeper</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="styles.css?v=97">
</head>
<body>

<div id="app">

  <!-- ヘッダー -->
  <header class="app-header">
    <button class="app-header__title" id="btn-title-home" type="button">
      <span class="app-header__mark">🍾</span>
      <h1>Bottle Keeper</h1>
    </button>
    <div class="app-header__status">
      <span id="app-version" class="app-version">v97</span>
      <button class="btn btn-sm btn-ghost" id="btn-home">🏠 ホーム</button>
      <button class="btn btn-sm btn-ghost" id="btn-reload">🔄 再読込</button>
      <button class="btn btn-sm btn-primary" id="btn-header-sync">サーバーに送信する</button>
      <span id="backup-status" class="backup-status">プッシュ: -<br>プル: -</span>
    </div>
  </header>

  <!-- 上部メニュー -->
  <nav class="topnav" id="topnav">
    <button class="topnav__item" data-screen="add">ボトル追加</button>
    <button class="topnav__item" data-screen="manage-bottle">ボトル検索</button>
    <button class="topnav__item" data-screen="visit-date-search">来店日検索</button>
    <button class="topnav__item" data-screen="manage-customer">顧客管理</button>
    <button class="topnav__item" data-screen="merge">統合</button>
    <button class="topnav__item" data-screen="disposal-target">破棄</button>
    <button class="topnav__item" data-screen="disposal-history">破棄履歴</button>
    <button class="topnav__item" data-screen="staff-review">破棄アンケート</button>
    <button class="topnav__item" data-screen="backup">設定</button>
  </nav>

  <div class="app-body">

    <!-- メインコンテンツ -->
    <main class="screen-root" id="screen-root">
      <!-- app.js がここに各画面を描画する -->
    </main>

  </div>
</div>

<!-- トースト通知 -->
<div id="toast-container" class="toast-container"></div>

<!-- 汎用モーダル -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal-box" class="modal-box"></div>
</div>

<script src="utils.js?v=97"></script>
<script src="storage.js?v=97"></script>
<script src="app.js?v=97"></script>
</body>
</html>
