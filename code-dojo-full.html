<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コード道場 — Bottle Keeperで学ぶ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161d1f;
  --panel:#1d2628;
  --panel-raised:#233030;
  --line:#2c3a3b;
  --teal:#2fb8c9;
  --teal-strong:#7fe0ea;
  --amber:#e8a93b;
  --coral:#e8707a;
  --purple:#a68cf0;
  --text:#e9f0ef;
  --text-muted:#9db0ae;
  --text-faint:#6b807d;
  --mono:'JetBrains Mono', ui-monospace, monospace;
  --sans:'Zen Kaku Gothic New', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{display:flex;min-height:100vh;}

.sidebar{
  width:270px; flex-shrink:0; background:var(--panel);
  border-right:1px solid var(--line);
  padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar__title{font-family:var(--mono); font-size:13px; color:var(--teal-strong); letter-spacing:0.08em; margin:0 0 2px 6px;}
.sidebar__sub{font-size:12px; color:var(--text-faint); margin:0 0 14px 6px;}
.sidebar__tabs{display:flex; gap:6px; margin:0 0 16px;}
.sidebar__tab{
  flex:1; text-align:center; font-family:var(--mono); font-size:11.5px; padding:8px 4px;
  background:var(--panel-raised); border:1px solid var(--line); border-radius:8px; color:var(--text-muted); cursor:pointer;
}
.sidebar__tab.is-active{background:var(--teal); color:#0a1516; border-color:var(--teal); font-weight:700;}

.level-label{font-family:var(--mono); font-size:10.5px; color:var(--text-faint); letter-spacing:0.1em; margin:14px 0 6px 6px;}
.level-label:first-child{margin-top:0;}
.stage{
  display:flex; align-items:flex-start; gap:10px; width:100%;
  background:transparent; border:none; color:var(--text-muted);
  padding:10px; border-radius:10px; cursor:pointer; text-align:left;
  font-family:var(--sans); font-size:13.5px; margin-bottom:2px; line-height:1.4;
}
.stage:hover{background:var(--panel-raised);}
.stage.is-active{background:var(--panel-raised); color:var(--text);}
.stage.is-active .stage__num{background:var(--teal); color:#0a1516;}
.stage__num{
  font-family:var(--mono); font-size:10.5px; font-weight:700; flex-shrink:0;
  width:20px; height:20px; border-radius:50%; background:var(--line); color:var(--text-muted);
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}
.stage__done{margin-left:auto; font-size:12px; color:var(--teal-strong); flex-shrink:0;}

main{flex:1; min-width:0; padding:48px 56px 120px; max-width:900px;}
.eyebrow{font-family:var(--mono); font-size:12px; color:var(--amber); letter-spacing:0.12em; margin-bottom:10px;}
h1{font-size:27px; font-weight:900; margin:0 0 6px; line-height:1.4;}
.lede{color:var(--text-muted); font-size:15.5px; line-height:1.85; margin:0 0 28px;}

.block{margin-bottom:34px;}
.block h2{font-size:16px; font-weight:700; color:var(--teal-strong); margin:0 0 12px; display:flex; align-items:center; gap:8px;}
.block p{font-size:15px; line-height:1.9; color:var(--text); margin:0 0 12px;}

.code-card{background:#10171a; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:14px 0 18px;}
.code-card__head{display:flex; align-items:center; gap:8px; padding:9px 14px; background:var(--panel-raised); font-family:var(--mono); font-size:12px; color:var(--text-faint); border-bottom:1px solid var(--line);}
.code-card__head .dot{width:9px;height:9px;border-radius:50%;background:#3a4a4a;}
.code-card pre{margin:0; padding:16px 18px; overflow-x:auto; font-family:var(--mono); font-size:13.5px; line-height:1.85; color:#c9d6d4;}

.annot{display:flex; gap:10px; align-items:flex-start; margin:10px 0; background:rgba(47,184,201,0.06); border:1px solid rgba(47,184,201,0.25); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.75;}
.annot__mark{font-family:var(--mono); font-weight:700; color:var(--teal-strong); flex-shrink:0;}

.try-it{border:1px dashed var(--amber); border-radius:10px; padding:14px 16px; margin:16px 0; background:rgba(232,169,59,0.06);}
.try-it__label{font-family:var(--mono); font-size:11.5px; color:var(--amber); letter-spacing:0.08em; margin-bottom:6px;}
.try-it p{margin:0; font-size:14.5px;}

.diagram{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px 14px; margin:16px 0;}
.diagram__cap{font-size:12.5px; color:var(--text-faint); text-align:center; margin-top:8px;}
.diagram svg{display:block; width:100%; height:auto;}

.quiz{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px 24px; margin-top:20px;}
.quiz__label{font-family:var(--mono); font-size:11.5px; color:var(--teal-strong); letter-spacing:0.1em; margin-bottom:10px;}
.quiz__q{font-size:15.5px; font-weight:700; margin:0 0 16px; line-height:1.7;}
.quiz__opt{display:block; width:100%; text-align:left; background:var(--panel-raised); border:1px solid var(--line); color:var(--text); font-family:var(--sans); font-size:14.5px; padding:12px 14px; border-radius:9px; cursor:pointer; margin-bottom:9px;}
.quiz__opt:hover{border-color:var(--teal);}
.quiz__opt.correct{background:rgba(47,184,201,0.18); border-color:var(--teal);}
.quiz__opt.wrong{background:rgba(232,112,122,0.16); border-color:var(--coral);}
.quiz__opt[disabled]{cursor:default;}
.quiz__feedback{font-size:14px; margin-top:10px; padding:10px 12px; border-radius:8px; display:none; line-height:1.7;}
.quiz__feedback.show{display:block;}
.quiz__feedback.ok{background:rgba(47,184,201,0.12); color:var(--teal-strong);}
.quiz__feedback.ng{background:rgba(232,112,122,0.12); color:var(--coral);}

.nav-buttons{display:flex; justify-content:space-between; margin-top:44px; gap:12px;}
.nb{font-family:var(--sans); font-weight:700; font-size:14px; padding:12px 20px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer;}
.nb.primary{background:var(--teal); color:#0a1516; border-color:var(--teal);}
.nb:disabled{opacity:0.35; cursor:default;}

.progress-track{height:4px; background:var(--line); border-radius:99px; margin:0 0 28px; overflow:hidden;}
.progress-fill{height:100%; background:var(--teal); border-radius:99px; transition:width .3s ease;}

/* ---------- プレイグラウンド ---------- */
.pg{display:none; height:100vh; width:100%; flex-direction:column;}
.pg.is-active{display:flex;}
.pg__toolbar{display:flex; align-items:center; gap:10px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0;}
.pg__toolbar h2{font-size:14px; margin:0; color:var(--teal-strong); font-family:var(--mono);}
.pg__spacer{flex:1;}
.pg__btn{font-family:var(--sans); font-size:13px; font-weight:700; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel-raised); color:var(--text); cursor:pointer;}
.pg__btn.danger{border-color:var(--coral); color:var(--coral);}
.pg__body{flex:1; display:flex; min-height:0;}
.pg__editor{width:50%; display:flex; flex-direction:column; border-right:1px solid var(--line); min-width:0;}
.pg__tabs{display:flex; background:var(--panel);}
.pg__tab{flex:1; text-align:center; padding:10px; font-family:var(--mono); font-size:13px; color:var(--text-muted); background:var(--panel); border:none; border-bottom:2px solid transparent; cursor:pointer;}
.pg__tab.is-active{color:var(--teal-strong); border-bottom-color:var(--teal);}
.pg__textwrap{position:relative; flex:1; min-height:0;}
.pg__textarea{position:absolute; inset:0; width:100%; height:100%; resize:none; border:none; outline:none; background:#10171a; color:#c9d6d4; font-family:var(--mono); font-size:13.5px; line-height:1.7; padding:16px 18px; display:none;}
.pg__textarea.is-active{display:block;}
.pg__suggest{position:absolute; background:var(--panel-raised); border:1px solid var(--teal); border-radius:8px; font-family:var(--mono); font-size:12.5px; z-index:20; max-width:280px; box-shadow:0 8px 24px rgba(0,0,0,0.4); display:none;}
.pg__suggest-item{padding:7px 12px; cursor:pointer; color:var(--text);}
.pg__suggest-item:hover, .pg__suggest-item.sel{background:var(--teal); color:#0a1516;}
.pg__preview{width:50%; min-width:0; display:flex; flex-direction:column;}
.pg__preview-head{padding:8px 14px; background:var(--panel); font-family:var(--mono); font-size:11.5px; color:var(--text-faint); border-bottom:1px solid var(--line);}
.pg__iframe{flex:1; border:none; background:#fff;}
.pg__hint{padding:8px 14px; background:var(--panel); border-top:1px solid var(--line); font-size:12px; color:var(--text-faint);}

.hamburger{display:none;}
@media (max-width: 860px){
  body{display:block;}
  .hamburger{
    display:flex; align-items:center; justify-content:center;
    position:fixed; top:12px; left:12px; z-index:60;
    width:42px; height:42px; border-radius:10px;
    background:var(--panel-raised); border:1px solid var(--line); color:var(--teal-strong);
    font-size:20px; cursor:pointer;
  }
  .sidebar{
    position:fixed; top:0; left:0; width:280px; height:100vh; z-index:50;
    transform:translateX(-100%); transition:transform .22s ease;
    border-right:1px solid var(--line); border-bottom:none;
    padding-top:64px;
  }
  .sidebar.is-open{transform:translateX(0);}
  .sidebar__backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:45;
  }
  .sidebar__backdrop.is-open{display:block;}
  main{padding:70px 18px 100px; max-width:none;}
  .pg__body{flex-direction:column;}
  .pg__editor, .pg__preview{width:100%;}
  .pg__toolbar{flex-wrap:wrap; padding-left:60px;}
}
</style>
</head>
<body>

<button class="hamburger" id="hamburgerBtn">☰</button>
<div class="sidebar__backdrop" id="sidebarBackdrop"></div>
<nav class="sidebar" id="sidebarNav">
  <p class="sidebar__title">🍾 CODE DOJO</p>
  <p class="sidebar__sub">Bottle Keeperのコードで学ぶ</p>
  <div class="sidebar__tabs">
    <div class="sidebar__tab is-active" data-mode="lesson">📖 本編</div>
    <div class="sidebar__tab" data-mode="playground">🛠 練習場</div>
  </div>
  <div class="flex-row" style="display:flex; gap:8px; margin-bottom:14px;">
    <button class="pg__btn" id="btnExportProgress" style="flex:1; font-size:12px; padding:8px 6px;">💾 進捗を保存</button>
    <button class="pg__btn" id="btnImportProgress" style="flex:1; font-size:12px; padding:8px 6px;">📂 進捗を読込</button>
  </div>
  <input type="file" id="fileImportProgress" accept="application/json" style="display:none;">
  <div id="stageList"></div>
</nav>

<main id="lessonMain">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div id="content"></div>
</main>

<div class="pg" id="playgroundMain">
  <div class="pg__toolbar">
    <h2>🛠 コード練習場</h2>
    <button class="pg__btn" id="pgTargetReal" style="border-color:var(--teal); color:var(--teal-strong);">🍾 本物のBottle Keeper</button>
    <button class="pg__btn" id="pgTargetSimple">🧩 簡単な例</button>
    <div class="pg__spacer"></div>
    <button class="pg__btn danger" id="pgReset">↺ リセット</button>
  </div>
  <div class="pg__body">
    <div class="pg__editor">
      <div class="pg__tabs">
        <button class="pg__tab is-active" data-lang="html">HTML</button>
        <button class="pg__tab" data-lang="css">CSS</button>
        <button class="pg__tab" data-lang="js">JS</button>
      </div>
      <div class="pg__textwrap">
        <textarea class="pg__textarea is-active" id="pgHtml" spellcheck="false"></textarea>
        <textarea class="pg__textarea" id="pgCss" spellcheck="false"></textarea>
        <textarea class="pg__textarea" id="pgJs" spellcheck="false"></textarea>
        <div class="pg__suggest" id="pgSuggest"></div>
      </div>
    </div>
    <div class="pg__preview">
      <div class="pg__preview-head">プレビュー（1秒ホバーで該当コードにジャンプ）</div>
      <iframe class="pg__iframe" id="pgFrame"></iframe>
      <div class="pg__hint">💡 プレビュー内の要素に1秒マウスを乗せると、左のHTML該当箇所にジャンプします</div>
    </div>
  </div>
</div>

<script>
// ============================================================
// 図解ヘルパー：シンプルな箱・矢印・木構造・タイムラインを組み立てる
// ============================================================
const DCOL = { teal:'#2fb8c9', tealSoft:'#1b3538', amber:'#e8a93b', amberSoft:'#3a2f1a',
  coral:'#e8707a', coralSoft:'#3a2224', purple:'#a68cf0', purpleSoft:'#2a2440',
  line:'#3a4a4a', text:'#e9f0ef', muted:'#9db0ae' };

function svgWrap(w, h, inner){
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="'Zen Kaku Gothic New',sans-serif">${inner}</svg>`;
}
function dTspanLines(text, x, dyFirst){
  const lines = String(text).split('\\n');
  return lines.map((ln,i) => `<tspan x="${x}" dy="${i===0?dyFirst:'1.3em'}">${ln}</tspan>`).join('');
}
function dBox(x,y,w,h,label,sub,color){
  const c = color || DCOL.teal;
  const labelLines = String(label).split('\\n');
  const subLines = sub ? String(sub).split('\\n') : [];
  const labelY = y + h/2 - (sub?8:0) - (labelLines.length-1)*8;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${c}22" stroke="${c}" stroke-width="1.6"/>
    <text x="${x+w/2}" y="${labelY}" text-anchor="middle" dominant-baseline="central" fill="${DCOL.text}" font-size="14" font-weight="700">${dTspanLines(label, x+w/2, 0)}</text>
    ${sub ? `<text x="${x+w/2}" y="${y+h/2+14}" text-anchor="middle" dominant-baseline="central" fill="${DCOL.muted}" font-size="11.5">${dTspanLines(sub, x+w/2, 0)}</text>` : ''}`;
}
function dArrow(x1,y1,x2,y2,color){
  const c = color || DCOL.muted;
  const id = 'ah'+Math.random().toString(36).slice(2,8);
  return `<defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="${c}" stroke-width="1.6"/></marker></defs>
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.6" marker-end="url(#${id})"/>`;
}
function dLabel(x,y,text,color,anchor){
  return `<text x="${x}" y="${y}" text-anchor="${anchor||'middle'}" fill="${color||DCOL.muted}" font-size="12.5" font-weight="700">${text}</text>`;
}


const STAGES = [
// ============================== 初級 ==============================
{
  level:'初級', id:'html', label:'HTML基礎', eyebrow:'STAGE 1 — HTML',
  title:'画面の「骨組み」を読む',
  lede:'Bottle Keeperの画面は、全部HTMLというタグの積み重ねでできている。まずは実際のヘッダー部分のコードを見てみよう。',
  blocks:[
    {type:'code', head:'index.html', code:
`&lt;button class="app-header__title" id="btn-title-home" type="button"&gt;
  &lt;span class="app-header__mark"&gt;🍾&lt;/span&gt;
  &lt;h1&gt;Bottle Keeper&lt;/h1&gt;
&lt;/button&gt;`},
    {type:'diagram', cap:'HTMLは「タグ」が入れ子になった木構造になっている', svg: () => svgWrap(640,220,`
      ${dBox(260,20,120,44,'button','（クリックできる箱）',DCOL.teal)}
      ${dArrow(320,64,150,110)}
      ${dArrow(320,64,320,110)}
      ${dArrow(320,64,490,110)}
      ${dBox(90,110,120,44,'span','絵文字',DCOL.amber)}
      ${dBox(260,110,120,44,'h1','見出し文字',DCOL.amber)}
      ${dBox(430,110,120,44,'（テキスト）','ただの文字',DCOL.purple)}
    `)},
    {type:'annot', mark:'button〜/button', text:'この&lt;button&gt;〜&lt;/button&gt;で囲まれた範囲が「1つの押せるボタン」になる。中に絵文字とタイトルの両方が入っているので、絵文字とタイトル、どちらを押してもボタンとして反応する。'},
    {type:'annot', mark:'id="btn-title-home"', text:'この id は「JavaScriptからこの要素を見つけ出すための名札」。app.jsの中でこの名札を頼りに「クリックされたらホームに戻る」という動きを後付けしている（HTML自体には動きは書かれていない）。'},
    {type:'annot', mark:'class="app-header__title"', text:'class はCSS（見た目の装飾ルール）から参照するための名札。idは基本1つの要素に1回しか使わないが、classは何個の要素にも同じ名前を使い回せる。'},
    {type:'try', text:'試しに &lt;h1&gt;Bottle Keeper&lt;/h1&gt; を &lt;h1&gt;よたかボトル管理&lt;/h1&gt; に書き換えると、ヘッダーのタイトル表示だけが変わる。周りの見た目（枠や配置）はCSS側の担当なので変化しない。'},
  ],
  quiz:{q:'このボタンの「見た目（色や余白）」を変えたい時、どこを直すべき？', opts:[
    {text:'index.htmlのタグの並び順を変える', ok:false, note:'並び順を変えると「何が中に入っているか」は変わるが、色や余白などの装飾は変わらない。'},
    {text:'app-header__title というclass名でstyles.cssの中を探して、そこを直す', ok:true, note:'その通り！見た目のルールは基本的にCSSファイルの中に書かれている。'},
    {text:'app.jsの中の文字列を書き換える', ok:false, note:'app.jsは主に「動き」を担当していて、見た目の色や余白はほぼ関係ない。'},
  ]}
},
{
  level:'初級', id:'css', label:'CSS基礎', eyebrow:'STAGE 2 — CSS',
  title:'色や配置の「ルール」を読む',
  lede:'来店ボタンが緑色になっているのは、CSSにそう書かれているから。実際のコードを見てみよう。',
  blocks:[
    {type:'code', head:'styles.css', code:`.btn-visit {
  background: #2E8B4F;
  color: #FFFFFF;
  padding: 8px 14px;
  border-radius: 8px;
}`},
    {type:'diagram', cap:'CSSは「セレクタ」が「対象」を選んで、その見た目を決める', svg: () => svgWrap(640,170,`
      ${dBox(40,60,150,50,'.btn-visit','セレクタ（誰に？）',DCOL.amber)}
      ${dArrow(190,85,320,85)}
      ${dBox(320,60,150,50,'background:色','property:値（どうする？）',DCOL.teal)}
      ${dArrow(470,85,540,85)}
      ${dBox(540,40,90,90,'実際の\\nボタン','',DCOL.purple)}
    `)},
    {type:'annot', mark:'.btn-visit', text:'先頭のドット(.)は「これはclass名を指すルールですよ」という意味。HTML側で class="btn-visit" が付いている要素すべてに、このルールが適用される。'},
    {type:'annot', mark:'background: #2E8B4F;', text:'#2E8B4F は色を表す「16進数カラーコード」。#の後ろの6桁が「赤・緑・青」の強さを2桁ずつ表している。'},
    {type:'annot', mark:'padding: 8px 14px;', text:'padding は「箱の内側の余白」。8pxが上下、14pxが左右の余白の広さ。この数字を大きくすると、ボタンがふっくら大きくなる。'},
    {type:'try', text:'#2E8B4F を #C62828（赤系）に変えると、来店ボタンが赤くなる。今回のアプリで「ボトルの種類ごとに色を変える」時も、同じようにカラーコードを差し替えるだけで対応した。'},
  ],
  quiz:{q:'「来店ボタンの文字を黒にしたい」場合、どの行をどう直す？', opts:[
    {text:'background: #2E8B4F; を background: #000000; にする', ok:false, note:'これだと文字ではなく、ボタンの背景色が黒になってしまう。'},
    {text:'color: #FFFFFF; を color: #000000; にする', ok:true, note:'正解。文字色を担当しているのは color プロパティ。'},
    {text:'.btn-visit という名前自体を書き換える', ok:false, note:'名前を変えると、HTML側のclass="btn-visit"と紐付かなくなり、ルールごと適用されなくなる。'},
  ]}
},
{
  level:'初級', id:'js-basics', label:'JS基礎（変数・関数）', eyebrow:'STAGE 3 — JavaScript',
  title:'「データを入れる箱」と「処理のまとまり」',
  lede:'JavaScriptの基本は「変数（データを入れる箱）」と「関数（処理のひとまとまり）」。実際に使われている関数を見てみよう。',
  blocks:[
    {type:'code', head:'app.js', code:`function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replaceAll('&amp;', '&amp;amp;')
    .replaceAll('&lt;', '&amp;lt;')
    .replaceAll('&gt;', '&amp;gt;');
}`},

const ALL_STAGES = [...STAGES, ...STAGES2, ...STAGES3];

let current = 0;
const done = new Set();
let mode = 'lesson';

function renderSidebar(){
  const el = document.getElementById('stageList');
  let html = '';
  let lastLevel = null;
  ALL_STAGES.forEach((s,i) => {
    if (s.level !== lastLevel) {
      html += `<div class="level-label">${s.level}</div>`;
      lastLevel = s.level;
    }
    html += `
      <button class="stage ${i===current?'is-active':''}" data-i="${i}">
        <span class="stage__num">${i+1}</span>
        <span>${s.label}</span>
        ${done.has(i) ? '<span class="stage__done">✓</span>' : ''}
      </button>
    `;
  });
  el.innerHTML = html;
  el.querySelectorAll('.stage').forEach(btn => {
    btn.addEventListener('click', () => {
      current = Number(btn.dataset.i);
      render();
      closeMobileSidebar();
      window.scrollTo(0,0);
    });
  });
}

  document.getElementById('sidebarNav').classList.add('is-open');
  document.getElementById('sidebarBackdrop').classList.add('is-open');
}
function closeMobileSidebar(){
  document.getElementById('sidebarNav').classList.remove('is-open');
  document.getElementById('sidebarBackdrop').classList.remove('is-open');
}
document.getElementById('hamburgerBtn').addEventListener('click', () => {
  const nav = document.getElementById('sidebarNav');
  nav.classList.contains('is-open') ? closeMobileSidebar() : openMobileSidebar();
});
document.getElementById('sidebarBackdrop').addEventListener('click', closeMobileSidebar);

// ============================== 学習進捗のJSON保存・読込 ==============================
function exportProgress(){
  const data = {
    exportedAt: new Date().toISOString(),
    completedStageIds: [...done].map(i => ALL_STAGES[i].id),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `code-dojo-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importProgress(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const ids = data.completedStageIds || [];
      done.clear();
      ALL_STAGES.forEach((s,i) => { if (ids.includes(s.id)) done.add(i); });
      render();
      alert(`進捗を読み込みました（${ids.length}件のステージが完了扱いになります）`);
    } catch (e) {
      alert('読み込みに失敗しました。正しいJSONファイルか確認してください。');
    }
  };
  reader.readAsText(file);
}
document.getElementById('btnExportProgress').addEventListener('click', exportProgress);
document.getElementById('btnImportProgress').addEventListener('click', () => document.getElementById('fileImportProgress').click());
document.getElementById('fileImportProgress').addEventListener('change', (e) => {
  if (e.target.files[0]) importProgress(e.target.files[0]);
});

function blockHtml(b){
  if (b.type === 'code') {
    return `<div class="code-card"><div class="code-card__head"><span class="dot"></span>${b.head}</div><pre>${b.code}</pre></div>`;
  }
  if (b.type === 'diagram') {
    return `<div class="diagram">${b.svg()}<div class="diagram__cap">${b.cap}</div></div>`;
  }
  if (b.type === 'annot') {
    return `<div class="annot"><span class="annot__mark">${b.mark}</span><span>${b.text}</span></div>`;
  }
  if (b.type === 'try') {
    return `<div class="try-it"><div class="try-it__label">🔧 やってみよう</div><p>${b.text}</p></div>`;
  }
  return '';
}

function render(){
  renderSidebar();
  const s = ALL_STAGES[current];
  document.getElementById('progressFill').style.width = (done.size / ALL_STAGES.length * 100) + '%';

  document.getElementById('content').innerHTML = `
    <p class="eyebrow">${s.eyebrow}</p>
    <h1>${s.title}</h1>
    <p class="lede">${s.lede}</p>
    ${s.blocks.map(blockHtml).join('')}
    <div class="quiz">
      <div class="quiz__label">✏️ 理解度チェック</div>
      <p class="quiz__q">${s.quiz.q}</p>
      <div id="quizOpts"></div>
      <div class="quiz__feedback" id="quizFeedback"></div>
    </div>
    <div class="nav-buttons">
      <button class="nb" id="prevBtn" ${current===0?'disabled':''}>← 前のステージ</button>
      <button class="nb primary" id="nextBtn" ${current===ALL_STAGES.length-1?'disabled':''}>次のステージ →</button>
    </div>
  `;

  const optsEl = document.getElementById('quizOpts');
  optsEl.innerHTML = s.quiz.opts.map((o,i) => `<button class="quiz__opt" data-i="${i}">${o.text}</button>`).join('');
  optsEl.querySelectorAll('.quiz__opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = Number(btn.dataset.i);
      const opt = s.quiz.opts[i];
      optsEl.querySelectorAll('.quiz__opt').forEach(b => b.disabled = true);
      btn.classList.add(opt.ok ? 'correct' : 'wrong');
      const fb = document.getElementById('quizFeedback');
      fb.textContent = (opt.ok ? '正解！ ' : '') + opt.note;
      fb.classList.add('show', opt.ok ? 'ok' : 'ng');
      if (opt.ok) done.add(current);
      renderSidebar();
      document.getElementById('progressFill').style.width = (done.size / ALL_STAGES.length * 100) + '%';
    });
  });

  document.getElementById('prevBtn').addEventListener('click', () => { current--; render(); window.scrollTo(0,0); });
  document.getElementById('nextBtn').addEventListener('click', () => { current++; render(); window.scrollTo(0,0); });
}

function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

  background: #2E8B4F;

  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}`;
const SIMPLE_JS = `document.getElementById('visitBtn').addEventListener('click', () => {
  document.querySelector('.name').textContent = '来店しました！';
});`;

let pgTarget = 'real'; // 'real' か 'simple'

const pgHtml = document.getElementById('pgHtml');
const pgCss = document.getElementById('pgCss');
const pgJs = document.getElementById('pgJs');
const pgFrame = document.getElementById('pgFrame');

function loadDefaults(){
  if (pgTarget === 'real') {
    pgHtml.value = REAL_HTML;
    pgCss.value = REAL_CSS;
    pgJs.value = REAL_JS;
  } else {
    pgHtml.value = SIMPLE_HTML;
    pgCss.value = SIMPLE_CSS;
    pgJs.value = SIMPLE_JS;
  }
}
loadDefaults();

function updatePreview(){
  const doc = `<!DOCTYPE html><html><head><style>${pgCss.value}</style></head><body>${pgHtml.value}<script>${pgJs.value}<\/script></body></html>`;
  pgFrame.srcdoc = doc;
}
[pgHtml, pgCss, pgJs].forEach(ta => ta.addEventListener('input', () => { updatePreview(); maybeSuggest(ta); }));
updatePreview();

document.getElementById('pgTargetReal').addEventListener('click', (e) => {
  pgTarget = 'real';
  document.getElementById('pgTargetReal').style.cssText = 'border-color:var(--teal); color:var(--teal-strong);';
  document.getElementById('pgTargetSimple').style.cssText = '';
  loadDefaults();
  updatePreview();
});
document.getElementById('pgTargetSimple').addEventListener('click', (e) => {
  pgTarget = 'simple';
  document.getElementById('pgTargetSimple').style.cssText = 'border-color:var(--teal); color:var(--teal-strong);';
  document.getElementById('pgTargetReal').style.cssText = '';
  loadDefaults();
  updatePreview();
});
document.getElementById('pgReset').addEventListener('click', () => {
  if (confirm('元のコードに戻します。よろしいですか？')) { loadDefaults(); updatePreview(); }
});

document.querySelectorAll('.pg__tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.pg__tab').forEach(t => t.classList.toggle('is-active', t === tab));
    document.querySelectorAll('.pg__textarea').forEach(t => t.classList.remove('is-active'));
    document.getElementById('pg' + tab.dataset.lang[0].toUpperCase() + tab.dataset.lang.slice(1)).classList.add('is-active');
  });
});

// ---- 簡易サジェスト（本格的なIntelliSenseではなく、簡易版の候補表示） ----
const SUGGEST_DICT = {
  html: ['div','span','button','h1','h2','p','class=""','id=""','input','img src=""'],
  css: ['color:','background:','padding:','margin:','border-radius:','font-size:','display:flex','text-align:center'],
  js: ['document.getElementById(','document.querySelector(','addEventListener(','const ','function ','if (','for ('],
};
const suggestBox = document.getElementById('pgSuggest');
function maybeSuggest(ta){
  const val = ta.value;
  const pos = ta.selectionStart;
  const before = val.slice(0, pos);
  const match = before.match(/([a-zA-Z.#\-]{2,})$/);
  suggestBox.style.display = 'none';
  if (!match) return;
  const frag = match[1].toLowerCase();
  const lang = ta.id === 'pgHtml' ? 'html' : ta.id === 'pgCss' ? 'css' : 'js';
  const cands = SUGGEST_DICT[lang].filter(c => c.toLowerCase().startsWith(frag) && c.toLowerCase() !== frag);
  if (cands.length === 0) return;
  suggestBox.innerHTML = cands.slice(0,6).map(c => `<div class="pg__suggest-item">${c}</div>`).join('');
  suggestBox.style.display = 'block';
  suggestBox.style.left = '18px';
  suggestBox.style.top = '40px';
  suggestBox.querySelectorAll('.pg__suggest-item').forEach(item => {
    item.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const insertText = item.textContent.slice(frag.length);
      ta.value = before + insertText + val.slice(pos);
      const newPos = pos + insertText.length;
      ta.focus();
      ta.setSelectionRange(newPos, newPos);
      suggestBox.style.display = 'none';
      updatePreview();
    });
  });
}
document.addEventListener('click', (e) => {
  if (!suggestBox.contains(e.target)) suggestBox.style.display = 'none';
});

// ---- プレビューを1秒ホバー→HTML該当箇所へジャンプ（簡易版） ----
// 仕組み：HTMLソースを解析し、各要素の開始タグの位置（文字インデックス）を記録しておく。
// プレビュー側の同じ要素にdata-src-index属性を仕込み、ホバー時にその位置へスクロール＆選択する。
let hoverTimer = null;
pgFrame.addEventListener('load', () => {
  try {
    const idoc = pgFrame.contentDocument;
    if (!idoc) return;
    idoc.body.querySelectorAll('*').forEach(el => {
      el.addEventListener('mouseenter', () => {
        hoverTimer = setTimeout(() => jumpToSource(el), 1000);
      });
      el.addEventListener('mouseleave', () => { clearTimeout(hoverTimer); });
    });
  } catch (e) { /* 無視 */ }
});

function jumpToSource(el){
  // タグ名 + 主要な属性（class/id）を手がかりに、HTMLソースの中からおおまかに該当箇所を探す
  const tag = el.tagName.toLowerCase();
  const cls = el.className && typeof el.className === 'string' ? el.className.split(' ')[0] : '';
  const id = el.id || '';
  const src = pgHtml.value;
  let searchStr = '<' + tag;
  if (id) searchStr = `id="${id}"`;
  else if (cls) searchStr = `class="${cls}`;
  const idx = src.indexOf(searchStr);
  if (idx === -1) return;
  // HTMLタブに切り替える
  document.querySelector('.pg__tab[data-lang="html"]').click();
  pgHtml.focus();
  pgHtml.setSelectionRange(idx, idx + searchStr.length);
  // スクロール位置をだいたい合わせる
  const lineHeight = 22;
  const linesBefore = src.slice(0, idx).split('\\n').length;
  pgHtml.scrollTop = Math.max(0, (linesBefore - 3) * lineHeight);
}

render();

</script>
